    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0b1a33;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #6b7a8f;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            outline: none;
            transition: 0.25s;
            margin-bottom: 24px;
            background: #f8fafc;
        }

        .search-box:focus {
            border-color: #0b1a33;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(11, 26, 51, 0.08);
        }

        .search-box::placeholder {
            color: #94a3b8;
        }

        /* Книга */
        .book {
            border-bottom: 1px solid #edf2f7;
        }

        .book:last-child {
            border-bottom: none;
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 6px 16px 10px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.15s;
            user-select: none;
        }

        .book-header:hover {
            background: #f6f8fa;
        }

        .book-title {
            font-weight: 700;
            font-size: 18px;
            color: #0b1a33;
            letter-spacing: -0.3px;
        }

        .book-arrow {
            font-size: 14px;
            color: #94a3b8;
            transition: transform 0.3s ease;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .book-header.open .book-arrow {
            transform: rotate(180deg);
        }

        .book-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.25s ease;
            opacity: 0;
            padding-left: 16px;
        }

        .book-items.open {
            max-height: 2000px;
            opacity: 1;
        }

        .book-item {
            padding: 8px 0 8px 20px;
            margin: 3px 0;
            border-radius: 8px;
            color: #1e293b;
            font-size: 15px;
            line-height: 1.5;
            background: #f8fafc;
        }

        .book-item:first-of-type {
            margin-top: 2px;
        }

        .book-item:last-of-type {
            margin-bottom: 10px;
        }

        /* Скрытое при поиске */
        .book.hidden {
            display: none;
        }

        /* Счётчик */
        .counter {
            font-size: 14px;
            color: #6b7a8f;
            margin-bottom: 16px;
            padding-left: 6px;
        }

        .counter span {
            font-weight: 600;
            color: #0b1a33;
        }

        @media (max-width: 600px) {
            .app {
                padding: 20px 16px;
            }
            h1 {
                font-size: 26px;
            }
            .book-title {
                font-size: 16px;
            }
        }
    </style>

        const container = document.getElementById('bookContainer');

        function renderBooks(filterText = '') {
            const lowerFilter = filterText.toLowerCase().trim();
            container.innerHTML = '';
            let visibleCount = 0;

            library.forEach((book) => {
                // Проверяем совпадение в названии ИЛИ в любом пункте
                const titleMatch = book.title.toLowerCase().includes(lowerFilter);
                const itemsMatch = book.items.some(item => 
                    item.toLowerCase().includes(lowerFilter)
                );
                const match = titleMatch || itemsMatch;

                const bookDiv = document.createElement('div');
                bookDiv.className = 'book';
                if (!match && lowerFilter !== '') {
                    bookDiv.classList.add('hidden');
                } else {
                    visibleCount++;
                }

                // Шапка
                const header = document.createElement('div');
                header.className = 'book-header';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'book-title';
                titleSpan.textContent = book.title;

                const arrowSpan = document.createElement('span');
                arrowSpan.className = 'book-arrow';
                arrowSpan.textContent = '▼';

                header.appendChild(titleSpan);
                header.appendChild(arrowSpan);

                // Пункты
                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'book-items';

                book.items.forEach((text) => {
                    const item = document.createElement('div');
                    item.className = 'book-item';
                    item.textContent = text;
                    itemsDiv.appendChild(item);
                });

                // Клик по шапке
                header.addEventListener('click', () => {
                    const isOpen = itemsDiv.classList.contains('open');
                    // Закрываем все
                    document.querySelectorAll('.book-items').forEach(el => {
                        el.classList.remove('open');
                    });
                    document.querySelectorAll('.book-header').forEach(el => {
                        el.classList.remove('open');
                    });
                    // Открываем текущий, если был закрыт
                    if (!isOpen) {
                        itemsDiv.classList.add('open');
                        header.classList.add('open');
                    }
                });

                bookDiv.appendChild(header);
                bookDiv.appendChild(itemsDiv);
                container.appendChild(bookDiv);
            });

            countDisplay.textContent = visibleCount;
        }

        // Поиск
        searchInput.addEventListener('input', (e) => {
            renderBooks(e.target.value);
        });

        // Стартовый рендер
        renderBooks();
    </script>
</body>
</html>
