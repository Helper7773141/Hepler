<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .app { max-width: 800px; width: 100%; background: #fff; border-radius: 24px; padding: 30px 28px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        h1 { font-size: 32px; font-weight: 700; color: #0b1a33; }
        .subtitle { color: #6b7a8f; font-size: 14px; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 14px 20px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 50px; outline: none; background: #f8fafc; margin-bottom: 20px; }
        .search-box:focus { border-color: #0b1a33; background: #fff; }
        .counter { font-size: 14px; color: #6b7a8f; margin-bottom: 16px; }
        .counter span { font-weight: 600; color: #0b1a33; }
        .book { border-bottom: 1px solid #edf2f7; }
        .book-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 6px 16px 10px; cursor: pointer; border-radius: 12px; transition: background 0.15s; user-select: none; }
        .book-header:hover { background: #f6f8fa; }
        .book-title { font-weight: 700; font-size: 18px; color: #0b1a33; }
        .book-arrow { font-size: 14px; color: #94a3b8; transition: transform 0.3s ease; margin-left: 12px; }
        .book-header.open .book-arrow { transform: rotate(180deg); }
        .book-items { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.35s ease, opacity 0.25s ease; padding-left: 16px; }
        .book-items.open { max-height: 2000px; opacity: 1; }
        .book-item { padding: 8px 0 8px 20px; margin: 3px 0; border-radius: 8px; background: #f8fafc; color: #1e293b; font-size: 15px; line-height: 1.5; }
        .book-item:last-of-type { margin-bottom: 10px; }
        .highlight { background: rgba(0, 120, 255, 0.25); border-radius: 4px; padding: 0 2px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <h1>Helper</h1>
        <div class="subtitle">справочник / дневник</div>
        <input type="text" class="search-box" id="searchInput" placeholder="Поиск по названию или содержанию..." />
        <div class="counter" id="counter">Показано: <span id="countDisplay">0</span></div>
        <div id="bookContainer"></div>
    </div>
    <script>
        const library = [
            { title: "ДЖЕФФРИ МУР", items: ["Зона производительности — действующий бизнес, приносит >90% выручки и прибыли.", "Зона продуктивности — задача: повышать прибыль первой зоны.", "Зона инкубации — «стартапы» внутри компании.", "Зона трансформации — масштабирование успешного проекта.", "Матрица производительности — продукты/услуги, генерирующие минимум 10% выручки.", "Программа по завершению жизненного цикла продуктов.", "Внутри торнадо — понимание этапа.", "Сверхконкуренция — фокус на потребителе.", "Высокоэффективный менеджмент.", "Добавляете ли вы реальную стоимость?", "Конструировать производственный поток.", "Решать проблему на низкой ступени.", "Базовая таблица отклонений."] },
            { title: "ПАТТИ МАККОРД", items: ["Нанимайте только сильных людей.", "Мотивируют не бонусы, а задачи.", "Радикальная честность.", "Не управляйте взрослыми как детьми.", "Контекст важнее контроля.", "Компания постоянно меняется.", "Люди важнее процессов.", "Свобода и ответственность.", "Высокая плотность талантов.", "Высокие стандарты.", "Бороться за сотрудника.", "Pay top of market.", "Сильная команда важнее звезды."] },
            { title: "РЭЙ ДАЛИО", items: ["Меритократия идей.", "Радикальная честность.", "Прозрачность.", "Ошибки — ключ к успеху.", "Цель → проблемы → анализ → план → исполнение.", "Поиск первопричины: Почему?", "Человек — набор привычек.", "Не нанимать универсального героя.", "Характер > навыки.", "Right person, right seat.", "Не снижать требования.", "Карточки сотрудников.", "Dot Collector.", "Журнал проблем.", "Оценивать закономерность.", "Высокие стандарты обратной связи."] },
            { title: "ДЖИМ КОЛЛИНЗ", items: ["Лидер пятого уровня.", "Window and mirror.", "КТО, а не что.", "Реализм + вера.", "Концепция ежа.", "Маховик.", "Не контроль, а дисциплина.", "Технологии как акселератор.", "ИДЕОЛОГИЯ.", "Экспериментировать.", "Home-grown Management."] },
            { title: "МАЙКЛ ПОРТЕР", items: ["Анализ макросреды.", "Отрасль задаёт прибыльность.", "Лучшие в издержках или дифференциации.", "Focus strategy.", "Лучше быть лучшим в одном.", "Цепочка создания ценности.", "Стратегия — выбор того, что НЕ делать.", "Преимущество трудно копируемо.", "PESTEL.", "5 сил Портера."] },
            { title: "СБОРНИК", items: ["BCG Matrix.", "Blue ocean strategy.", "7P.", "Бенчмаркинг.", "Латеральный маркетинг.", "Одна привычка меняет компанию."] },
            { title: "ПОЗИЦИОНИРОВАНИЕ", items: ["Позиционирование до маркетинга.", "Создать новую категорию.", "Лучший заголовок — незаконченный.", "Не рекламировать мечты менеджеров.", "Марка — в сознании.", "Если похоже на утку...", "Колба vs стакан воды.", "Важность названия.", "Контекст продукта.", "Хороший продукт не продаётся.", "«Ну и что?»", "Лучшие клиенты помогают.", "Уникальные возможности.", "Помогаем стать тем, кем хочет.", "Мы не для всех.", "Что заставит рассказывать?"] },
            { title: "THINKING", items: ["Think clearly.", "Интуиция — библиотека опыта.", "Мозг для выживания.", "Не путать результат и решение.", "Сильный мыслитель замечает ошибки.", "Не позволять эмоциям.", "Вероятности, не гарантии.", "Ментальная гибкость.", "Три исхода.", "Правило обратного мышления.", "Think fast and slow.", "Мозг достраивает.", "Ассоциативные эффекты.", "Ощущение легкости ≠ истина.", "Продавцов больше."] },
            { title: "ТОМ ВУДЖЕК", items: ["Уровни ума: сила, гибкость, выносливость, координация.", "Отвлекающие факторы.", "Приложение для фокусировки."] },
            { title: "МЕНЕДЖМЕНТ", items: ["Планирование, организация, мотивация, контроль.", "Этапы планирования.", "Цель → Миссия → Видение.", "Контроль: предварительный, текущий, заключительный.", "Анализ → идентификация → критерии → альтернативы → выбор → согласование → реализация → контроль."] },
            { title: "ГЬЯНА", items: ["Думать как владелец.", "Подобное притягивает подобное.", "Не «за что?», а «для чего?».", "Успех — идти от поражения.", "Слабость системы компенсируют шумом.", "American Express.", "Система отбирает людей.", "Стимулы важнее намерений.", "Стимулы сильнее инструкций.", "Фирма экономит издержки.", "Контроль — способ узнать вклад.", "CEO — распределитель капитала.", "Улучшать ощущение.", "Не инженерные, а психологические решения.", "Реклама не убеждает.", "Формулировка проблемы.", "Цена создаёт ценность.", "Смотреть сквозь данные.", "Маленькие изменения.", "Угрозы в процветание.", "Что привело к успеху вчера.", "Не решать стратегию операционкой.", "Бояться правды — жить в иллюзии.", "«Яблочный» маркетинг.", "Начать с малого.", "1на1 с сотрудниками.", "В Google — развитие людей.", "Репутация дороже денег.", "Правильные вопросы.", "Заботиться о стоимости.", "Большой ≠ великий.", "Закон Паккарда.", "Ключевые позиции.", "Иметь работу vs принимать ответственность.", "Должность vs ответственность.", "Система виновата.", "Не спасать сегодня.", "Менеджмент служит.", "Риск — остаться живым.", "Плохие люди vs хорошие.", "Характер важнее.", "Решение по ситуации.", "Не бояться правил."] },
            { title: "ПРИЛОЖЕНИЯ", items: ["Ранний рынок: новаторы и визионеры.", "Пропасть.", "Торнадо.", "Мейн стрит."] }
        ];

        const container = document.getElementById('bookContainer');
        const searchInput = document.getElementById('searchInput');
        const countDisplay = document.getElementById('countDisplay');
        let timeoutId = null;

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderBooks(filterText = '') {
            const lowerFilter = filterText.toLowerCase().trim();
            container.innerHTML = '';
            let visibleCount = 0;

            document.querySelectorAll('.book-items').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.book-header').forEach(el => el.classList.remove('open'));

            library.forEach((book) => {
                const titleMatch = book.title.toLowerCase().includes(lowerFilter);
                const itemsMatch = book.items.some(item => item.toLowerCase().includes(lowerFilter));
                const match = titleMatch || itemsMatch;

                const bookDiv = document.createElement('div');
                bookDiv.className = 'book';
                if (!match && lowerFilter !== '') {
                    bookDiv.classList.add('hidden');
                } else {
                    visibleCount++;
                }

                const header = document.createElement('div');
                header.className = 'book-header';
                const titleSpan = document.createElement('span');
                titleSpan.className = 'book-title';
                titleSpan.textContent = book.title;
                const arrowSpan = document.createElement('span');
                arrowSpan.className = 'book-arrow';
                arrowSpan.textContent = '▼';
                header.appendChild(titleSpan);
                header.appendChild(arrowSpan);

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'book-items';
                book.items.forEach((text) => {
                    const item = document.createElement('div');
                    item.className = 'book-item';
                    if (lowerFilter && itemsMatch) {
                        item.innerHTML = highlightText(text, filterText);
                    } else {
                        item.textContent = text;
                    }
                    itemsDiv.appendChild(item);
                });

                header.addEventListener('click', () => {
                    const isOpen = itemsDiv.classList.contains('open');
                    document.querySelectorAll('.book-items').forEach(el => el.classList.remove('open'));
                    document.querySelectorAll('.book-header').forEach(el => el.classList.remove('open'));
                    if (!isOpen) {
                        itemsDiv.classList.add('open');
                        header.classList.add('open');
                    }
                });

                bookDiv.appendChild(header);
                bookDiv.appendChild(itemsDiv);
                container.appendChild(bookDiv);
            });

            countDisplay.textContent = visibleCount;

            if (lowerFilter) {
                document.querySelectorAll('.book-item').forEach(item => {
                    if (item.querySelector('.highlight')) {
                        item.style.transition = 'background 0.2s';
                        item.style.background = 'rgba(0, 120, 255, 0.2)';
                        setTimeout(() => { item.style.background = '#f8fafc'; }, 600);
                    }
                });
                document.querySelectorAll('.book').forEach((bookEl) => {
                    if (!bookEl.classList.contains('hidden')) {
                        const header = bookEl.querySelector('.book-header');
                        const items = bookEl.querySelector('.book-items');
                        if (header && items) {
                            items.classList.add('open');
                            header.classList.add('open');
                        }
                    }
                });
            }
        }

        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => renderBooks(e.target.value), 150);
        });

        renderBooks();
    </script>
</body>
</html>
