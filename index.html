<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== ВСЕ СТИЛИ (ТЕ ЖЕ, ЧТО И БЫЛИ) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f5f7fa 0%, #e8eef5 50%, #d4e0e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease;
            position: relative;
        }
        
        body.dark {
            background: linear-gradient(180deg, #1a202c 0%, #2d3748 50%, #1a365d 100%);
            background-attachment: fixed;
        }

        .app {
            max-width: 680px;
            width: 100%;
            background: transparent;
            border-radius: 24px;
            padding: 28px 20px;
            box-shadow: none;
            position: relative;
            z-index: 1;
            overflow: visible;
            transition: all 0.3s ease;
        }
        
        body.dark .app {
            background: transparent;
            box-shadow: none;
        }

        /* ===== ШАПКА ===== */
        .header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .header-left .menu-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #0b1a33;
            cursor: pointer;
            padding: 6px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .header-left .menu-btn:hover { 
            background: rgba(0, 0, 0, 0.05); 
        }
        
        body.dark .header-left .menu-btn { 
            color: #e0e0e0; 
        }
        
        body.dark .header-left .menu-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
        }

        .header-center {
            text-align: center;
            flex: 1;
        }
        
        .header-center .book-icon {
            font-size: 28px;
            color: #0b1a33;
            display: block;
            margin-bottom: 2px;
        }
        
        body.dark .header-center .book-icon { 
            color: #e0e0e0; 
        }
        
        .header-center h1 {
            font-size: 30px;
            font-weight: 700;
            color: #0b1a33;
            margin: 0;
        }
        
        body.dark .header-center h1 { 
            color: #e0e0e0; 
        }
        
        .header-center .subtitle {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 2px;
        }
        
        body.dark .header-center .subtitle { 
            color: #a0aec0; 
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 6px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #0b1a33;
            transition: background 0.2s;
        }
        
        .theme-toggle:hover { 
            background: rgba(0, 0, 0, 0.05); 
        }
        
        body.dark .theme-toggle { 
            color: #e0e0e0; 
        }
        
        body.dark .theme-toggle:hover { 
            background: rgba(255, 255, 255, 0.1); 
        }

        /* ===== ПОИСК ===== */
        .search-wrap {
            position: relative;
            margin-bottom: 8px;
        }

        .search-wrap .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 15px;
            pointer-events: none;
        }

        .search-box {
            width: 100%;
            padding: 14px 18px 14px 46px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            outline: none;
            background: #e4eaf1;
            box-shadow: 0 2px 8px rgba(11, 26, 51, 0.06);
            transition: all 0.3s ease;
        }
        
        .search-box::placeholder {
            color: #a0aec0;
        }
        
        .search-box:focus { 
            background: #e6ebf1;
        }
        
        body.dark .search-box { 
            background: #2a2a2a; 
            color: #e0e0e0; 
            box-shadow: none;
        }
        
        body.dark .search-box::placeholder { 
            color: #888; 
        }
        
        body.dark .search-box:focus { 
            background: #333;
        }

        body.dark .search-wrap .search-icon {
            color: #777;
        }

        /* ===== КНИГИ ===== */
        .book {
            margin-bottom: 0;
        }
        
        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 4px;
            cursor: pointer;
            border-radius: 0;
            transition: opacity 0.2s;
            user-select: none;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(11, 26, 51, 0.08);
            box-shadow: none;
        }
        
        .book:last-child .book-header {
            border-bottom: none;
        }
        
        .book-header:hover {
            opacity: 0.7;
        }
        
        body.dark .book-header { 
            background: transparent; 
            border-bottom-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }
        
        body.dark .book-header:hover { 
            opacity: 0.7;
        }

        .book-header .book-title-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }
        
        .book-header .book-icon {
            font-size: 20px;
            color: #0b1a33;
            width: 24px;
            text-align: center;
        }
        
        body.dark .book-header .book-icon { 
            color: #e0e0e0; 
        }
        
        .book-title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            color: #0b1a33;
        }
        
        body.dark .book-title { 
            color: #e0e0e0; 
        }
        
        .book-arrow {
            font-size: 13px;
            color: #b8c4d1;
            transition: transform 0.3s ease;
            margin-left: 10px;
            width: 20px;
            text-align: center;
        }
        
        .book-header.open .book-arrow { 
            transform: rotate(180deg); 
        }

        /* ===== СПИСОК ЭЛЕМЕНТОВ ===== */
        .book-items {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;
        }
        
        .book-items.open { 
            opacity: 1;
            margin-top: 6px;
        }

        .item-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 16px;
            margin: 4px 0;
        }
        
        .item-num {
            font-weight: 400;
            font-size: 12px;
            color: #6b7a8f;
            min-width: 22px;
            text-align: right;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        body.dark .item-num {
            color: #a0aec0;
        }
        
        .item-text {
            flex: 1;
            padding: 6px 10px;
            border-radius: 8px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 14px;
            line-height: 1.5;
        }
        
        body.dark .item-text { 
            background: #2a2a2a; 
            color: #e0e0e0; 
        }
        
        .item-text i { 
            font-style: italic; 
            color: #0b1a33; 
        }
        
        body.dark .item-text i {
            color: #e0e0e0;
        }
        
        .item-text b { 
            font-weight: 700; 
            color: #0b1a33; 
        }
        
        body.dark .item-text b {
            color: #e0e0e0;
        }
        
        .item-text .section-title { 
            font-weight: 700; 
            font-size: 14px; 
            color: #0b1a33; 
            display: block; 
            margin: 4px 0 2px 0; 
        }
        
        body.dark .item-text .section-title {
            color: #e0e0e0;
        }
        
        .item-text .book-subhead { 
            font-weight: 600; 
            font-size: 14px; 
            color: #0b1a33; 
            display: block; 
            margin: 4px 0 2px 0;
            text-decoration: underline;
        }
        
        body.dark .item-text .book-subhead {
            color: #e0e0e0;
        }
        
        .highlight { 
            background: rgba(0, 120, 255, 0.25); 
            border-radius: 3px; 
            padding: 0 3px;
        }
        
        body.dark .highlight { 
            background: rgba(100, 150, 255, 0.3);
        }
        
        .hidden { display: none; }

        /* ===== NETFLIX PAGE ===== */
        .netflix-page { 
            display: none; 
            padding: 10px 0 30px; 
        }
        
        .netflix-page.active { 
            display: block; 
        }
        
        .netflix-page .header-row { 
            display: none !important; 
        }
        
        .netflix-back {
            background: none;
            border: none;
            font-size: 15px;
            color: #0b1a33;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        
        .netflix-back:hover { 
            opacity: 0.6;
        }
        
        body.dark .netflix-back { 
            color: #e0e0e0; 
        }
        
        .netflix-title { 
            text-align: center; 
            font-size: 26px; 
            font-weight: 700; 
            color: #0b1a33; 
            margin-bottom: 20px;
        }
        
        body.dark .netflix-title { 
            color: #e0e0e0; 
        }
        
        .netflix-toc { 
            background: #f8fafc; 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 24px;
        }

        /* ===== ТОЛЬКО ТЕЛЕФОН, ТОЛЬКО СВЕТЛАЯ ТЕМА ===== */
        @media (max-width: 480px) {
            body:not(.dark) .netflix-toc { 
                background: #dce4ef !important;
            }
        }
        
        body.dark .netflix-toc { 
            background: #2a2a2a;
        }
        
        .netflix-toc-title { 
            font-weight: 600; 
            font-size: 12px; 
            color: #6b7a8f; 
            margin-bottom: 10px;
        }
        
        body.dark .netflix-toc-title { 
            color: #aaa; 
        }
        
        .netflix-toc a { 
            display: block; 
            padding: 8px 10px; 
            color: #0b1a33; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 14px; 
            border-bottom: 1px solid #edf2f7;
        }
        
        .netflix-toc a:last-child { 
            border-bottom: none;
        }
        
        .netflix-toc a:hover { 
            opacity: 0.6;
        }
        
        body.dark .netflix-toc a { 
            color: #e0e0e0;
            border-bottom-color: #444;
        }

        .netflix-article { 
            margin-bottom: 24px; 
            scroll-margin-top: 20px; 
        }
        
        .netflix-article:last-child { 
            margin-bottom: 0; 
        }
        
        .netflix-article .heading { 
            text-align: center; 
            font-size: 17px; 
            font-weight: 700; 
            color: #0b1a33; 
            margin-bottom: 12px;
        }
        
        body.dark .netflix-article .heading { 
            color: #e0e0e0;
        }
        
        .netflix-article .text { 
            font-size: 14px; 
            line-height: 1.6; 
            color: #1e293b; 
            white-space: pre-wrap; 
        }
        
        body.dark .netflix-article .text { 
            color: #ccc; 
        }
        
        .netflix-divider { 
            border: none; 
            border-top: 1px solid #e2e8f0; 
            margin: 24px 0; 
        }
        
        body.dark .netflix-divider { 
            border-top-color: #444; 
        }

        /* ===== ПЕТЛЯ ПРИВЫЧКИ (диаграмма) ===== */
        .habit-loop {
            display: flex;
            justify-content: center;
            margin: 0 0 28px;
        }

        .habit-loop-img {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: block;
        }

        .habit-loop-dark { display: none; }
        body.dark .habit-loop-light { display: none; }
        body.dark .habit-loop-dark { display: block; }

        /* ===== MENU ===== */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }
        
        .menu-overlay.open { 
            opacity: 1; 
            visibility: visible; 
        }
        
        .menu-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 80%;
            max-width: 280px;
            height: 100%;
            background: #fff;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.15);
            transform: translateX(-100%);
            transition: transform 0.35s ease;
            z-index: 1000;
            padding: 24px 20px;
            overflow-y: auto;
        }
        
        .menu-panel.open { 
            transform: translateX(0); 
        }
        
        body.dark .menu-panel { 
            background: #1e1e1e; 
        }
        
        .menu-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #0b1a33;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 4px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body.dark .menu-close { 
            color: #e0e0e0; 
        }
        
        .menu-item {
            font-size: 17px;
            font-weight: 700;
            color: #0b1a33;
            padding: 14px 12px;
            border-bottom: 1px solid #edf2f7;
            cursor: pointer;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover { 
            opacity: 0.6;
        }
        
        body.dark .menu-item { 
            color: #e0e0e0;
            border-bottom-color: #444;
        }
        
        .menu-item .sub { 
            font-weight: 400; 
            font-size: 12px; 
            color: #94a3b8; 
            margin-left: 6px; 
        }

        /* ===== MOBILE ===== */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            
            .app { 
                padding: 24px 16px; 
                border-radius: 20px; 
            }
            
            .header-center h1 { 
                font-size: 26px; 
            }
            
            .header-center .book-icon {
                font-size: 24px;
            }
            
            .book-header {
                padding: 15px 18px;
            }
            
            .book-title {
                font-size: 14px;
            }
            
            .item-row {
                padding: 6px 14px;
            }
            
            .item-text {
                font-size: 13px;
            }
            
            .netflix-title { 
                font-size: 22px; 
            }
            
            .netflix-article .heading { 
                font-size: 16px; 
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ===== ШАПКА ===== -->
        <div class="header-row" id="mainHeader">
            <div class="header-top">
                <div class="header-left">
                    <button class="menu-btn" id="menuToggle" aria-label="Меню">
                        <i class="fa-regular fa-bars"></i>
                    </button>
                </div>
                <div class="header-center">
                    <h1>Helper</h1>
                    <div class="subtitle">Справочник</div>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                    <i class="fa-regular fa-moon"></i>
                </button>
            </div>
        </div>

        <div id="mainPage">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-box" id="searchInput" placeholder="Поиск по названию или содержанию..." />
            </div>
            <div id="bookContainer"></div>
        </div>

        <div class="netflix-page" id="netflixPage">
            <button class="netflix-back" id="netflixBack">
                <i class="fa-solid fa-arrow-left"></i> Назад
            </button>
            <div class="netflix-title">Netflix+</div>
            <div class="netflix-toc" id="netflixToc">
                <div class="netflix-toc-title">Содержание</div>
            </div>
            <div id="netflixArticles"></div>
        </div>

        <div class="netflix-page" id="pgPage">
            <button class="netflix-back" id="pgBack">
                <i class="fa-solid fa-arrow-left"></i> Назад
            </button>
            <div class="netflix-title">Procter & Gamble</div>
            <div class="netflix-toc" id="pgToc">
                <div class="netflix-toc-title">Содержание</div>
            </div>
            <div id="pgArticles"></div>
        </div>

        <div class="netflix-page" id="historyPage">
            <button class="netflix-back" id="historyBack">
                <i class="fa-solid fa-arrow-left"></i> Назад
            </button>
            <div class="netflix-title">История стран</div>
            <div class="netflix-toc" id="historyToc">
                <div class="netflix-toc-title">Содержание</div>
            </div>
            <div id="historyArticles"></div>
        </div>

        <div class="netflix-page" id="habitPage">
            <button class="netflix-back" id="habitBack">
                <i class="fa-solid fa-arrow-left"></i> Назад
            </button>
            <div class="netflix-title">Сила привычки</div>
            <div class="netflix-toc" id="habitToc">
                <div class="netflix-toc-title">Содержание</div>

    <script>
        // ===== ТЕМА =====
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark');
            themeToggle.innerHTML = '<i class="fa-regular fa-sun"></i>';
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            themeToggle.innerHTML = isDark ? '<i class="fa-regular fa-sun"></i>' : '<i class="fa-regular fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // ===== ДАННЫЕ КНИГ (КОНТУРНЫЕ ИКОНКИ) =====
        const library = [
            { title: "ДЖЕФФРИ МУР", icon: "fa-regular fa-chart-bar", items: [
                "<b>4 зоны</b><br>• <b>Зона производительности</b> – действующий бизнес, который приносит > 90% выручки и прибыли. Главная задача: выполнять текущие планы продаж и защищать долю рынка.<br>• <b>Зона продуктивности.</b> Задача: повышать прибыль первой зоны.<br>• <b>Зона инкубации.</b> «Стартапы» внутри компании. Задача: разрабатывать прорывные продукты и проверять их на рынке, финансируя как венчурные проекты.<br>• <b>Зона трансформации.</b> Сюда выходит один успешный проект из инкубации, чтобы его быстро масштабировать в новое направление бизнеса.",
                "<b>Матрица производительности.</b> Продукты/услуги генерирующие минимум 10% общей выручки компании. Есть свои ответственные за каждую ячейку матрицы. Позволяет грамотнее распределять лучших руководителей и фокусировать внимание.",

        // ===== РЕНДЕР КНИГ =====
        const container = document.getElementById('bookContainer');
        const searchInput = document.getElementById('searchInput');
        let timeoutId = null;

        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderBooks(filterText = '') {
            const lowerFilter = filterText.toLowerCase().trim();
            container.innerHTML = '';
            document.querySelectorAll('.book-items').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.book-header').forEach(el => el.classList.remove('open'));

            library.forEach((book) => {
                const titleMatch = book.title.toLowerCase().includes(lowerFilter);
                const itemsMatch = book.items.some(item => item.toLowerCase().includes(lowerFilter));
                const match = titleMatch || itemsMatch;

                const bookDiv = document.createElement('div');
                bookDiv.className = 'book';
                if (!match && lowerFilter !== '') bookDiv.classList.add('hidden');

                const header = document.createElement('div');
                header.className = 'book-header';
                const titleWrap = document.createElement('div');
                titleWrap.className = 'book-title-wrap';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'book-icon';
                iconSpan.innerHTML = `<i class="${book.icon}"></i>`;
                const titleSpan = document.createElement('span');
                titleSpan.className = 'book-title';
                titleSpan.textContent = book.title;
                titleWrap.appendChild(iconSpan);
                titleWrap.appendChild(titleSpan);
                const arrowSpan = document.createElement('span');
                arrowSpan.className = 'book-arrow';
                arrowSpan.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
                header.appendChild(titleWrap);
                header.appendChild(arrowSpan);

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'book-items';
                let clearIdx = 0, fastIdx = 0, isFast = false;

                book.items.forEach((text) => {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    const numSpan = document.createElement('span');
                    numSpan.className = 'item-num';
                    const isSection = text.includes('section-title');
                    const isSubhead = text.includes('book-subhead');
                    if (isSection || isSubhead) {
                        if (text.includes('Think fast and slow')) {
                            isFast = true;
                            clearIdx = 0;
                            fastIdx = 0;
                        } else {
                            isFast = false;
                            clearIdx = 0;
                            fastIdx = 0;
                        }
                        numSpan.textContent = '';
                    } else {
                        if (isFast) { fastIdx++; numSpan.textContent = fastIdx; }
                        else { clearIdx++; numSpan.textContent = clearIdx; }
                    }
                    const textSpan = document.createElement('span');
                    textSpan.className = 'item-text';
                    if (lowerFilter && (titleMatch || itemsMatch)) textSpan.innerHTML = highlightText(text, filterText);
                    else textSpan.innerHTML = text;
                    row.appendChild(numSpan);
                    row.appendChild(textSpan);
                    itemsDiv.appendChild(row);
                });

                header.addEventListener('click', () => {
                    const isOpen = itemsDiv.classList.contains('open');
                    document.querySelectorAll('.book-items').forEach(el => { if (el !== itemsDiv) { el.classList.remove('open'); el.style.maxHeight = '0px'; } });
                    document.querySelectorAll('.book-header').forEach(el => { if (el !== header) el.classList.remove('open'); });
                    if (!isOpen) {
                        itemsDiv.classList.add('open');
                        itemsDiv.style.maxHeight = itemsDiv.scrollHeight + 'px';
                        header.classList.add('open');
                        let scrolled = false;
                        const scrollToBook = () => {
                            if (scrolled) return;
                            scrolled = true;
                            const rect = header.getBoundingClientRect();
                            const offset = 20;
                            window.scrollTo({ top: window.scrollY + rect.top - offset, behavior: 'smooth' });
                        };
                        itemsDiv.addEventListener('transitionend', function onEnd(e) {
                            if (e.target === itemsDiv && e.propertyName === 'max-height') {
                                itemsDiv.removeEventListener('transitionend', onEnd);
                                scrollToBook();
                            }
                        });
                        setTimeout(scrollToBook, 450);
                    } else {
                        itemsDiv.classList.remove('open');
                        itemsDiv.style.maxHeight = '0px';
                        header.classList.remove('open');
                    }
                });

                bookDiv.appendChild(header);
                bookDiv.appendChild(itemsDiv);
                container.appendChild(bookDiv);
            });
        }

        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => renderBooks(e.target.value), 150);
        });
        renderBooks();

        const netflixArticles = [
            { title: "Критика руководства", text: `Все помнят сказку «Новое платье короля» — про глупого монарха, которого убедили, что он одет в роскошнейший наряд, тогда как в действительности он расхаживал перед подданными в чем мать родила. Никто не посмел сказать ему об этом, кроме ребенка, ничего не знавшего о власти, субординации и последствиях ее нарушения.\n\nЧем выше должность, тем реже человек слышит критику в свой адрес и тем выше вероятность, что однажды, фигурально выражаясь, он придет на работу голым — то есть совершит ошибку, которая станет очевидна всем, кроме него.` },
            { title: "Правильная критика / открытость", text: `Спустя неделю ко мне неожиданно подошел его непосредственный начальник. Он был в курсе нашего конфликта и сказал, что формально я, в общем-то, прав, но знаю ли я, что после моей выволочки тот инженер совершенно утратил интерес к работе? Может быть, я хочу подорвать работоспособность всего отдела? Нет, этого я, разумеется, не хотел. Коллега продолжил.\n\n- Как вы думаете, вы сумели бы высказать все то же самое в такой форме, чтобы человек поверил в свои силы и захотел сам исправить ошибки?\n- Ну да, — ответил я. - Наверное, сумел бы.\n- Хорошо. Пожалуйста, в дальнейшем постарайтесь поступать именно так.\n\nИ я стал стараться.\nВся эта беседа заняла не более двух минут и возымела мгновенное действие. Заметьте, коллега не стал называть меня хамом или плохим руководителем. Он просто задал два вопроса: «Хотите ли вы навредить компании?» и «Можете ли вы вести себя по-человечески?» Разумеется, на каждый из них возможен лишь один ответ. Если бы он просто сказал «Вы хам», я бы, наверное, ответил: «Ничего подобного». Но он высказал претензии в вопросительной форме, и мне волей-неволей пришлось задуматься и немного покопаться в себе.` },
            { title: "График отпусков", text: `Мы все иногда удаленно работаем по выходным, отвечаем на письма и сообщения в любое время суток, берем полдня отгула по семейным обстоятельствам. При этом никто не ведет учет отработанных часов. Почему же тогда мы считаем количество свободных дней?\n\nВ 2003 году, на той самой встрече, где мы договорились о свободном порядке предоставления отпусков, она настаивала: чтобы эксперимент увенчался успехом, нам, руководителям, нужно будет брать длительные отпуска и постоянно говорить на эту тему с командой. В отсутствие регламента пример лидеров становится жизненно важным. Патти заявила, что хочет видеть по всему офису наши открытки из Индонезии или с озера Тахо, а когда Тед Сарандос вернулся с юга Испании, потребовала, чтобы весь персонал просмотрел его слайд-шоу из семи тысяч фотографий.\n\nВ отсутствие единой политики большинство людей смотрят на окружающих и пытаются вычислить «мягкие границы» дозволенного. Я всегда любил путешествовать и еще до отмены графика отпусков успел побывать во многих странах. Но после того как мы перешли на свободный режим, я стал гораздо больше рассказывать о своих поездках и впечатлениях всем, кто был готов слушать.\n\nКраха не случилось, мы лишь дали нашим звездам больше возможностей распоряжаться собственной жизнью.` },
            { title: "Премии мешают гибкости", text: `Зачастую премии выдаются за рост годовой выручки, рост цен на акции или иные метрики и показатели которые могут не отражать суть всей работы, а лишь заставлять сотрудников концентрироваться на выполнении этих kpi, нежели на развитии компании и самих себя. Но что, если через пять лет какому-нибудь подразделению ради сохранения конкурентоспособности придется перестроиться? Резкая смена курса потребует инвестиций и экспериментов, способных частично съесть годовую прибыль. И цена акций тоже может упасть. Какой же руководитель пойдет на такой риск? Вот почему такие компании, как Warner или Disney, не всегда успешно вписываются в новые реалии. А в Netflix это удавалось неоднократно.\n\nКроме того, я не очень-то верю, что профессионал высочайшего уровня будет сильнее стараться, если помахать перед ним пачкой купюр. Настоящие мастера, как правило, работают на совесть и стремятся к совершенству независимо от того, светит ли им дополнительная награда. Мне очень нравятся слова бывшего главы «Deutsche bank» Джона Крайена: «Понятия не имею, почему мне предложили контракт со всякими бонусами. Уверяю вас, я не стану лучше или хуже работать в такой-то год или в такой-то день оттого, что мне дадут больше или меньше денег». Под этой цитатой подпишется любой специалист, который не зря ест свой хлеб.\n\nСтудентам предложили заработать крупную сумму (600 долларов) или более скромную (60 долларов), выполнив два задания: одно требовало умственных усилий (сложение чисел), для второго был нужен чисто механический навык (как можно быстрее нажимать на клавиши). Мы обнаружили, что там, где требовались только механические действия, обещанная награда сработала предсказуемым образом: чем больше сумма, тем лучше показатели. Но когда мы добавили задание, предполагавшее хотя бы минимальные умственные усилия, картина оказалась точно такой же, как в индийском эксперименте: обещание крупного вознаграждения понижало качество работы.` },
            { title: "Кричите о провалах", text: `Почти десять лет спустя, в 2007 году, я вошел в совет директоров Microsoft. Стив Балмер (который тогда занимал в компании пост СЕО, генерального директора) - персонаж крупный, яркий и шумный. Он весьма откровенно каялся в своих ошибках и мог, например, сказать: «Вот, поглядите, что я тут наворотил!» Это меня сразу подкупило. Какой искренний и самокритичный парень! И вдруг я понял: да у меня же на него нормальная человеческая реакция — доверять тем, кто не боится вслух признать свои ошибки.\n\nДа и примеры Рида Хастинга, то как он при всех признавал ошибку Qwikster.` },
            { title: "Рискуйте", text: `Когда я пришла в Netflix, Джек посоветовал считать, что мне выдали стопку фишек. Я могу поставить их на любой проект, который посчитаю перспективным. Чтобы делать удачные ставки, нужно много работать и тщательно обдумывать каждый шаг, и задача Джека — научить меня именно этому.\n\nОдни ставки сыграют, другие — нет. О моей работе будут судить не по успеху каждого отдельно взятого выигрыша, а по моей общей способности использовать фишки так, чтобы рабочий процесс двигался вперед. Джек предельно четко дал мне понять: в Netflix не увольняют за то, что одна ставка оказалась неудачной. Работу можно потерять, если вообще не используешь фишки, чтобы сорвать большой куш, или допускаешь промахи раз за разом.\n\nОдни ставки сыграют, другие - нет. Об успехах сотрудника будут судить по общему итогу ставок, а не по каждому конкретному результату.` },
            { title: "Про увольнения", text: `Наша цель - сделать так, чтобы увольнение из Netflix перестало считаться постыдным. Представим себе, например, олимпийскую сборную по хоккею. Вылететь из основного состава команды, конечно, очень печально. Но твои близкие все равно будут гордиться тем, что у тебя хватило сил и таланта в него попасть. Расставаясь с сотрудниками, мы надеемся на такое же отношение. Мы остаемся друзьями, и никакого позора тут нет.\n\nОдин из наиболее ярких примеров — история самой Патти Маккорд. Проработав с ней больше десяти лет, я начал чувствовать, что лучше бы поручить ее роль кому-то другому. Я поделился этими мыслями с Патти, и мы вместе постарались понять, откуда возникло такое ощущение. Выяснилось, что Патти уже давно хочется работать поменьше, она ушла из компании, и проблема решилась наилучшим образом. Теперь, семь лет спустя, она остается моим близким другом и неофициальным советником.\n\nДругой пример — Лесли Килгор. Она была великолепным директором по маркетингу и сыграла ключевую роль в становлении нашей культуры, в битве с компанией Blockbuster да и вообще в эволюции Netflix. Она была и остается прекрасным бизнес-стратегом. Но с выходом сериала «Карточный домик» я осознал, что наше будущее скорее в продвижении своего контента, чем в покупке чужого, и понял: на месте Лесли должен быть человек с обширным опытом работы в Голливуде (особенно если учесть, что сам я ничего не понимаю в шоу-бизнесе). Как следствие, я освободил Лесли от занимаемой должности, но она выразила желание войти в совет директоров компании. И вот уже много лет это прекрасный директор и мой начальник.` },
            { title: "Про конкуренцию внутри", text: `Мы хотим, чтобы наши менеджеры регулярно задавали себе контрольные вопросы в отношении каждого сотрудника. Но мы всеми силами избегаем ранжирования и повальных увольнений. «Вы должны уволить Х процентов сотрудников» — вот образец тех самых правил и процедур, которых мы избегаем. Конечно, таким способом можно избавиться от заурядных работников, но командный дух этого не переживет. Мне нужно, чтобы первоклассные сотрудники Netflix состязались с нашими конкурентами, а не друг с другом. Устраивая чистки рядов, вы потеряете в плане сотрудничества ничуть не меньше, чем выиграете в плане концентрации таланта.\n\nНаше отличие от спортивных команд в том, что количество наших игроков не ограничено жесткими правилами. И чтобы выиграл один, другому совершенно необязательно проиграть. Напротив, чем больше талантов у нас в команде, тем значительнее наши успехи. Чем масштабнее успехи, тем сильнее мы растем. Чем активнее мы растем, тем больше у нас открывается новых позиций. Чем больше позиций, тем больше в команде места для талантливых сотрудников.` },
            { title: "Конкуренция внутри+", text: `Профессор австралийского университета Нового Южного Уэльса Уилл Фелпс провел увлекательный эксперимент, наглядно показавший, насколько заразительным бывает поведение на рабочем месте. Он собрал несколько групп из четырех студентов и попросил каждую команду выполнить некую административную задачу за 45 минут — академический час. Командам, которые справятся наилучшим образом, было обещано вознаграждение в 100 долларов.\n\nВ некоторые группы без ведома остальных студентов внедрили актеров, причем каждому поручили строго определенную роль: «лентяя», который быстро теряет интерес к работе, кладет ноги на стол и начинает рассылать сообщения; «скептика-критикана», который грубо реагирует на каждую идею и постоянно отпускает реплики вроде «Вы что, издеваетесь?!» И «Чему вас только учили?!»; «депрессивного нытика», который выглядит так, будто у него вчера скончался любимый котик, — он жалуется, что задача непомерно сложная, вслух сомневается, что команда сможет выиграть, и время от времени роняет голову на руки. Актеры играли натурально, другие участники эксперимента даже не заподозрили, что невесть откуда взявшиеся незнакомцы - не обычные студенты.\n\nПочти сразу Фелпс обнаружил: даже когда члены группы исключительно умны и талантливы, деструктивное поведение «подсадки» резко снижает показатели всей команды. Результаты десятков экспериментов, проведенных в течение нескольких месяцев, были схожими: группы с «засланным казачком» в составе отставали от лидеров на 30-40%.\n\nРезультаты Фелпса опровергли прежние представления о том, что отдельные члены группы воспринимают нормы и ценности коллектива и со временем начинают подстраиваться под них - выявилась как раз обратная зависимость. Поведение одного человека вскоре начинало влиять на всю команду.` },
            { title: "Мы не семья", text: `На протяжении многих веков ремесла передавались из поколения в поколение, а бизнес был почти исключительно семейным. Неудивительно, что метафора семьи до сих пор так популярна в деловом мире. Семья символизирует верность, сплоченность, постоянную взаимовыручку. Но в семье тебя принимают любым, даже если ты будешь нести всеобщий вред и усложнять всем жизнь.` },
            { title: "Страх увольнения", text: `Когда сплавляешься по горной реке, тебя учат смотреть не на пороги и водовороты, а на спокойную, тихую воду рядом. Опытные люди знают: если впиться взглядом в опасное место, скорее всего, тебя туда и затянет. Вот так и в Netflix: мы говорим сотрудникам, что нужно сосредоточиться на полезном опыте, командной работе и достижениях. Если у сотрудника развивается панический страх увольнения (как у спортсмена иногда развивается панический страх травмы), он не может вести игру спокойно и уверенно, а значит, рискует столкнуться именно с теми проблемами, которых всеми силами стремится избежать.` },
            { title: "Пример начальства", text: `Когда я работал в Фениксе, еще до Netflix, в 1997 году, мы с коллегами отправились на выездное мероприятие - из тех, где есть и производственная часть, и развлекательный компонент, чтобы группа могла сплотиться и немножко развеяться. Позади ресторана, где мы обедали, была вышка для банджи-джампинга. За 15 баксов можно было сигануть вниз головой у всех на виду. Туда никто не рвался, но я решил попробовать. Когда все благополучно закончилось, хозяин вышки спросил меня: «Не хотите прыгнуть еще раз? Могу предложить второй прыжок бесплатно». Мне стало любопытно: «С чего вдруг такая щедрость?» Он ответил: «Я хочу, чтобы ваши коллеги, которые сейчас глазеют из ресторана, увидели, что вам понравилось. Если они поймут, что это нестрашно, им тоже захочется попробовать».\n\nИменно поэтому вы, как лидер, должны делиться полученными откликами со своей командой — и в первую очередь откровенно высказываться о том, что у вас получается плохо. Так вы покажете остальным, что предлагать и выслушивать конструктивную критику не так уж страшно.` },
            { title: "Тяжело, но необходимо", text: `Большинство моих соотечественников (и я в том числе) излагает любую мысль так, как нас учили в школе. Я формулирую тему, привожу теоретические обоснования, излагаю аргументы и контраргументы, а затем делаю выводы. Введение, тезис, антитезис, заключение. Именно так нас, французов, с детства учат писать и говорить.\n\nАмериканцев гораздо чаще учат «сразу переходить к делу и гнуть свою линию». С точки зрения французов, это выглядит очень странно: откуда взялись выводы, если еще не приводились доводы? Netflix, разумеется, прежде всего американская компания. Мой начальник — американец, и все мои коллеги родом из США. Долгое время я не догадывалась, что мой способ коммуникации плохо подходит для них.\n\nВ ноябре 2016 года мой руководитель организовал для команды «сессию-360». Я немного нервничала, но успокаивала себя мыслями о том, чего достигла за время работы в Netflix. Я была уверена, что по праву занимаю место в звездной команде.\n\nКогда настала моя очередь выслушивать критические замечания, Джоэль сказала, что мне нужно улучшать коммуникативные навыки. По ее словам, я слишком долго подхожу к теме разговора, и следить за моими рассуждениями сложно. Я опешила. «Что? У меня слабые коммуникативные навыки? Да я специалист по коммуникации! Способность четко донести мысль — это моя главная сила!» Замечание Джоэль показалось мне совершенно бессмысленным, и я готова была его отклонить.\n\nНо затем слово взяли другие американские коллеги. Они говорили обо мне много хорошего, но звучали и такие претензии: «Вы слишком увлекаетесь теорией», «Ваши сообщения трудно читать», «У вас очень длинные тексты». Примерно на пятый раз я готова была воскликнуть: «Ну ладно, ладно, поняла. Не нужно накидываться на меня всем скопом». После седьмого выступления я разозлилась. Мне захотелось огрызнуться: «Эй ты, американец! Попробуй-ка поработать во французской компании. Посмотрим, как там понравится твоя манера письма!»\n\nЭтот вечер в Waldorf состоялся два года назад. В плане профессионального роста он дал мне больше, чем предыдущие десять лет работы в Netflix. Я научилась адаптироваться и переключаться с французской модели коммуникации на американскую и обратно. Это оказалось очень сложно, но на следующих сессиях коллеги меня хвалили и поздравляли. Тот первый раз был ужасным, но без него я наверняка провалила бы тест на вылет из команды. И вряд ли я сейчас работала бы в Netflix.` },
            { title: "Неудача тоже победа", text: `Когда ваша команда покупает и производит контент в разных странах мира, необходимо сосредоточиться на уроках, которые можно извлечь из любого опыта. Будьте готовы делать крупные рискованные ставки в странах с наибольшим потенциалом, чтобы мы могли как следует изучить рынок. Нам нужны победы, но еще больше нам нужны крупные, громкие поражения, на которых мы сможем учиться. Нам нужно постоянно задаваться вопросом: «Если мы купим вот эту программу и она провалится, какую информацию нам это даст? Если какую-то большую и важную, нужно покупать».` },
            { title: "Различия культур", text: `Поездка в Свазиленд в составе Корпуса мира в 1983 году не была для меня первым зарубежным путешествием, но именно она дала мне самый ценный опыт.\n\nВо время плановой контрольной я дал им задачку, с которой, по моим представлениям, они все должны были справиться: «Длина комнаты 3 м, а ширина 2 м. Сколько плиток со стороной 20 см понадобится, чтобы выложить весь пол?» Ни один из моих учеников не дал верного ответа, а большинство вообще оставили в тетради пустое место.\n\n- Что, ни один? Никто не знает, как ее решить? — потрясенно спросил я, рухнул на стул и обвел класс отчаянным взглядом. Руку поднял Табо, рослый, серьезный 16-летний паренек.\n\n- Да, Табо? Пожалуйста, скажи нам, как решить эту задачу, — я с надеждой поднялся из-за стола. Но Табо хотел задать вопрос.\n\n- Мистер Хастингс, сэр... Простите, пожалуйста, а что такое плитка?\n\nБольшинство моих учеников жили в традиционных круглых хижинах, и полы там были земляные или бетонные. Они не смогли решить задачу, потому что не поняли, о чем она, — подростки никогда в жизни не видели плитки. Они просто не понимали, что именно требуется посчитать.\n\nЭтот казус — далеко, кстати, не единичный — помог мне понять, что к чужой культуре нельзя подходить со своими мерками и представлениями. Чтобы добиться поставленных целей, нужно приспособиться, перестроиться на новый лад.` },
            { title: "Регламентация не всегда плохо", text: `Я проработал в Японии уже около полугода, и, несмотря на все наши призывы и поощрения, спонтанная критика в офисе звучала очень редко. Когда настало время отчета «360 градусов», я был настроен скептически.\n\nМы заполнили электронные формы, а затем провели очную «сессию-360». Трудно представить себе более чуждый японцам формат: прилюдно высказывать критические замечания коллегам, в том числе старшим по положению. Однако я знал, что в японской культуре есть элементы, которые могли бы помочь с коллективной дискуссией. Большинство японцев крайне ответственно и добросовестно подходят к любому заданию. Если выдать им четкое руководство к действию, они всеми силами постараются выполнить задачу. Скажите им: «Пожалуйста, подготовьтесь к мероприятию. Вот инструкция, которой нужно следовать» — и результат почти всегда окажется великолепным.\n\nТак случилось и с отчетом «360 градусов». Наша японская команда справилась с задачей едва ли не лучше, чем американские сотрудники в предыдущие годы. Все замечания были откровенными и тщательно продуманными, рекомендации — четкими и конструктивными, а мнения высказывались четко и прямо. При этом критика принималась спокойно и с благодарностью.\n\nВпоследствии, когда я обсуждал результаты с командой, мне сказали: «Вы объяснили нам, что это часть работы. Вы объяснили, что нужно делать и как это сделать. Мы заранее подготовились, а кое-что даже отрепетировали. Нам хотелось выполнить поставленную вами задачу».\n\nИз этого опыта мы сделали вывод (он оказался верным не только для Японии, но и для всех стран, где не принято критиковать в лоб): не стоит просить сотрудников с ходу высказывать критические замечания коллегам и руководителям в неформальной обстановке. Но если подготовить официальное мероприятие, включить обратную связь в повестку дня и задать предельно ясные параметры, на выходе вы получите столь же полезную и конструктивную критику, как и у себя дома.\n\nПовышайте количество формальных моментов и процедур, но не забывайте параллельно выстраивать доверительные отношения с командой. Спонтанных критических замечаний в неформальной обстановке вы, скорее всего, не дождетесь. Но должную степень откровенности можно обеспечить, если заранее включить обратную связь в повестку дня и дать сотрудникам время на подготовку.` },
            { title: "Когда ошибка слишком дорога", text: `Представьте, что мы опубликовали бы финансовый отчет, а затем пришлось бы сдавать назад и говорить: «Погодите, мы ошиблись. На самом деле выручка гораздо ниже». Это был бы настоящий провал. Или возьмем вопросы кибербезопасности. Что, если бы кто-нибудь взломал нашу систему, украл информацию о пользователях и слил ее в интернет? Это была бы катастрофа.\n\nВ тех случаях, когда предотвращение ошибок явно важнее инноваций, мы запускаем десятки процедур и проводим множество проверок. В такие моменты Netflix должна походить на хирургическую клинику, где пять человек следят, чтобы операцию провели на «правильном» колене. Если ошибка способна обернуться катастрофой, правила и регламенты не просто полезны — они жизненно необходимы.` }
        ];

        const pgArticles = [
            { title: "Компания, которая прожила почти два столетия благодаря постоянным изменениям", tocTitle: "200 лет изменений", text: `История Procter & Gamble началась в 1837 году, когда свечник Уильям Проктер и производитель мыла Джеймс Гэмбл объединили свои небольшие предприятия. На протяжении почти двухсот лет компания неоднократно сталкивалась с кризисами, сменой технологий, мировыми войнами, экономическими спадами и появлением новых конкурентов. Однако каждый раз вместо попыток сохранить привычный порядок она перестраивала себя практически заново. P&G постоянно выходила в новые категории товаров, меняла производственные процессы, экспериментировала с маркетингом и перестраивала организацию. Именно способность регулярно меняться, а не успех какого-то одного продукта, стала главным источником ее долговечности. В книге эта мысль проходит красной нитью: компания существует почти два века не потому, что однажды стала успешной, а потому, что никогда не переставала меняться.` },
            { title: "Почему лучшие продукты иногда проигрывают: урок Латинской Америки", tocTitle: "Рынок сильнее любой бизнес модели", text: `Одним из самых болезненных уроков для P&G стала экспансия в страны Латинской Америки. Руководство компании рассчитывало, что многолетний опыт и сильные бренды позволят быстро занять лидирующие позиции, однако реальность оказалась совершенно иной. На большинстве рынков уже существовали десятки небольших местных производителей стирального порошка, которые продавали продукт буквально «на каждый день». Вместо привычных больших коробок порошок фасовали в маленькие красные или прозрачные пакетики, стоившие настолько дешево, что покупатель мог позволить себе приобрести их даже с дневного заработка. Для миллионов семей цена одной покупки была гораздо важнее цены килограмма продукта.\n\nПервоначально P&G пыталась конкурировать привычными методами: делать ставку на более высокое качество стирки и известность брендов Ariel и Tide. Однако вскоре стало понятно, что компания смотрит на рынок глазами обеспеченного западного потребителя. Для местных покупателей вопрос заключался не в том, какой порошок лучше отстирывает, а в том, могут ли они вообще позволить себе купить его сегодня. Тогда компания полностью пересмотрела стратегию. Были разработаны специальные, более дешевые формулы, уменьшены размеры упаковок, перестроены цепочки поставок и даже пересмотрена экономика производства. Этот опыт стал одним из самых ярких уроков в истории P&G: нельзя просто перенести успешную бизнес-модель из одной страны в другую. Каждый рынок требует собственного продукта, собственной цены и собственного понимания потребителя.` },
            { title: "Pampers", tocTitle: "Pampers", text: `Когда инженеры предложили идею одноразовых подгузников, большинство руководителей считали проект слишком дорогим и бесперспективным. Родители десятилетиями пользовались тканевыми подгузниками, а себестоимость нового продукта была настолько высокой, что заработать на нем было практически невозможно.\n\nНесмотря на многочисленные неудачи, компания продолжала инвестировать в технологию. Инженеры годами совершенствовали конструкцию, снижали расход материалов, улучшали впитывающий слой и постепенно удешевляли производство. В результате P&G не просто вывела успешный продукт, а фактически создала целую мировую категорию товаров. Один из главных выводов этого кейса — по-настоящему большие рынки часто приходится создавать самостоятельно.\n\nИнтересно, что первые версии Pampers вызывали массу жалоб. Подгузники плохо сидели, натирали кожу и стоили слишком дорого. Для многих компаний подобный запуск стал бы поводом закрыть проект, однако в P&G приняли противоположное решение. Вместо поиска виноватых компания начала детально изучать каждую жалобу покупателей и использовала обратную связь как источник новых идей.\n\nСледующие несколько лет продукт практически непрерывно совершенствовался. Каждая новая версия устраняла недостатки предыдущей. Именно такой подход впоследствии стал частью корпоративной культуры P&G: плохой первый продукт не означает плохую идею.` },
            { title: "Нил МакЭлрой и рождение современной системы бренд-менеджмента", tocTitle: "Рождение бренд-менеджмента", text: `В 1931 году молодой сотрудник P&G Нил МакЭлрой написал руководству трехстраничную служебную записку. Он обратил внимание, что внутри компании никто не отвечает за развитие конкретного бренда целиком. Производство думало о выпуске продукции, продавцы — о продажах, рекламщики — о рекламе, однако не существовало человека, который ежедневно жил бы интересами одного продукта.\n\nМакЭлрой предложил революционную по тем временам идею: каждый бренд должен получить собственного менеджера, который будет знать о нем абсолютно всё — изучать покупателей, следить за конкурентами, анализировать продажи, инициировать исследования и отвечать за долгосрочное развитие. Руководство поддержало эту идею, и именно так появилась система бренд-менеджмента, которую позже скопировали практически все мировые FMCG-компании. Удивительно, что одно из самых влиятельных управленческих решений XX века родилось не в результате многолетней реформы, а благодаря короткой внутренней записке.\n\nТакой подход оказался революционным. Внутри одной компании бренды начинали конкурировать между собой за внимание покупателей, а менеджеры получали настоящую предпринимательскую ответственность. Позже именно эту систему переняли тысячи компаний по всему миру.` },
            { title: "Лучшие идеи рождаются не в кабинетах, а в обычной жизни", tocTitle: "Лучшие идеи не рождаются в кабинетах", text: `Одна из интересных историй P&G показывает, что великие продукты иногда появляются не благодаря заранее составленному плану, а благодаря неожиданному наблюдению. Компания долго работала над новым шампунем и пыталась решить сложную техническую задачу: потребители хотели одновременно два противоположных эффекта. С одной стороны, шампунь должен был хорошо очищать волосы и удалять жиры и загрязнения. С другой — после использования волосы должны были оставаться мягкими, здоровыми и ухоженными. Проблема заключалась в том, что эти две задачи долгое время конфликтовали между собой: сильное очищение часто делало волосы сухими, а уходовые компоненты могли мешать эффективному очищению.\n\nКоманда P&G проводила многочисленные исследования и эксперименты, но долго не могла найти правильное сочетание технологий. Переломный момент произошел неожиданно: один из сотрудников компании во время отпуска обратил внимание на обычную бытовую ситуацию, связанную с удалением жиров и масел. Это наблюдение заставило его по-другому взглянуть на проблему шампуня и предположить, что похожий принцип можно использовать для создания новой формулы.\n\nПосле возвращения в компанию эта идея стала основой для дальнейшей работы исследователей. Спустя годы экспериментов P&G удалось создать продукт, который объединял очищение и уход — то, что раньше казалось практически невозможным. Именно такие истории компания потом использовала как пример своей философии: инновации рождаются не только в лабораториях, но и в способности замечать проблемы в обычной жизни.\n\nГлавный урок этого кейса заключался в том, что настоящий прорыв часто появляется не тогда, когда команда ищет «новую идею», а когда кто-то по-новому смотрит на старую проблему.` },
            { title: "Swiffer: люди не хотели новую швабру — они хотели меньше убирать", tocTitle: "Swiffer и сила восприятия", text: `Во время наблюдений исследователи заметили, что большинство людей ненавидят сам процесс мытья пола. Их раздражало полоскание тряпки, грязная вода и необходимость постоянно возвращаться к ведру. Никто из покупателей не просил придумать новую швабру, но практически все хотели избавиться от самых неприятных этапов уборки.\n\nТак появилась система Swiffer с одноразовыми салфетками. Компания решила не совершенствовать старую технологию, а полностью изменить сам процесс уборки. Этот кейс стал классическим примером того, что настоящие инновации появляются после изучения поведения людей, а не после проведения обычных опросов.` },
            { title: "Менеджеры, которые думали как владельцы бизнеса", tocTitle: "Думайте не как менеджер", text: `Одной из особенностей P&G стала система подготовки руководителей. Молодых менеджеров регулярно переводили между странами, подразделениями и товарными категориями. За несколько лет человек мог поработать в маркетинге, производстве, продажах и международном бизнесе.\n\nТакой подход позволял выращивать руководителей с очень широким кругозором. Вместо узких специалистов компания получала людей, способных видеть весь бизнес целиком. Именно поэтому выпускников P&G позже приглашали руководить крупнейшими мировыми корпорациями.` },
            { title: "Когда компания признала, что не может придумать всё сама", tocTitle: "Границы инноваций", text: `Долгое время P&G полагалась исключительно на собственные исследовательские лаборатории. Однако со временем руководство поняло, что количество талантливых инженеров и ученых за пределами компании гораздо больше, чем внутри нее. Тогда была запущена программа открытых инноваций Connect + Develop.\n\nКомпания начала активно искать перспективные технологии в университетах, небольших стартапах и научных центрах по всему миру. Вместо того чтобы изобретать всё самостоятельно, P&G научилась быстро находить лучшие идеи и превращать их в массовые продукты. Этот подход радикально ускорил появление новых разработок и стал примером для многих международных компаний.` },
            { title: "Кризис, который заставил компанию упростить саму себя", tocTitle: "Кризис - лучшая точка роста", text: `В течение многих десятилетий у P&G была почти невероятная история роста. Компания жила с очень амбициозной целью — примерно каждые десять лет удваивать прибыль. Долгое время ей удавалось выполнять это обещание: новые категории, сильные бренды, международная экспансия и постоянные инновации обеспечивали стабильное увеличение бизнеса.\n\nОднако к концу 1990-х годов привычная модель начала давать сбой. Компания стала слишком сложной: появилось огромное количество подразделений, процессов и уровней управления. Масштаб, который раньше был преимуществом, начал превращаться в проблему. Запуск новых продуктов замедлился, расходы росли, а P&G уже не могла двигаться с той скоростью, которая была необходима для достижения прежних целей.\n\nИменно этот кризис стал точкой перелома. Когда Алан Лафли возглавил компанию, он понял, что проблема заключается не в недостатке сильных брендов или талантливых людей, а в самой системе управления. P&G нужно было не просто немного улучшить существующую модель, а заново упростить себя.\n\nЛафли сосредоточился на нескольких ключевых вещах: убрал лишнюю сложность, ускорил принятие решений, вернул компании фокус на потребителя и заставил руководителей думать не только о внутренних процессах, но и о реальных проблемах покупателей. Он также сделал ставку на открытые инновации и развитие сильнейших брендов вместо попытки делать всё одновременно.\n\nПарадокс этой истории в том, что кризис, который сначала выглядел как угроза для компании, стал главным источником следующего этапа роста. Если бы P&G продолжала работать так же успешно, как раньше, она могла бы еще долго не замечать накопившихся проблем. Именно давление кризиса заставило руководство задать неудобные вопросы и изменить систему.\n\nЭтот кейс стал одним из главных уроков истории P&G: иногда самый сильный рост начинается не тогда, когда всё идет хорошо, а тогда, когда старая модель перестает работать и компания вынуждена создавать новую.` },
            { title: "Завод будущего: почему P&G перестала строить просто фабрики", tocTitle: "Оптимизация производства", text: `В книге хорошо показано, что к концу XX века конкурентное преимущество начали создавать уже не только продукты, но и сами производственные системы. Новые предприятия P&G проектировались так, чтобы практически каждая операция измерялась и анализировалась. Если на одном заводе инженеры находили способ сократить время переналадки оборудования хотя бы на несколько минут, этот опыт быстро распространялся по всей мировой сети.\n\nОсобенно интересно, что руководство перестало считать производство чем-то второстепенным. Лучших инженеров отправляли запускать новые предприятия, а сами заводы превращались в площадки для постоянных экспериментов. Компания стремилась к тому, чтобы каждая следующая фабрика была лучше предыдущей, а каждое новое поколение оборудования сразу учитывало ошибки прошлого. За десятилетия именно тысячи небольших улучшений дали P&G огромное преимущество по себестоимости и скорости производства.` },
            { title: "«Уничтожьте свой собственный продукт раньше, чем это сделает конкурент»", tocTitle: "Не бойтесь терять долю рынка", text: `Одна из самых необычных идей, проходящих через книгу, заключалась в том, что руководители P&G сознательно были готовы делать собственные продукты устаревшими. Если инженеры создавали более совершенную версию товара, компания не боялась, что она «съест» продажи предыдущей модели. Наоборот, считалось, что гораздо лучше самому заменить свой успешный продукт новым, чем ждать, пока это сделает конкурент.\n\nИз-за этого многие бренды компании десятилетиями практически непрерывно обновлялись. Менялись формулы, упаковка, технологии производства и способы использования. Иногда улучшения были почти незаметны для покупателя, но за десять–пятнадцать лет продукт становился совершенно другим. Такой подход требовал смелости от менеджеров, ведь им приходилось рисковать уже успешным бизнесом ради будущего роста.` },
            { title: "Pringles: десять лет борьбы за продукт, которого никто не понимал", tocTitle: "Pringles", text: `Создание Pringles стало одним из самых долгих проектов в истории P&G. Компания хотела решить проблему, с которой сталкивались все производители картофельных чипсов: они быстро ломались, были неодинакового размера, а в пакетах неизбежно превращались в крошку. Однако первые версии нового продукта не вызывали восторга. Покупателям не нравился вкус, текстура казалась слишком непривычной, а сама идея «чипсов из картофельного теста» воспринималась скептически.\n\nВместо того чтобы отказаться от проекта, инженеры и маркетологи начали годами совершенствовать продукт. Они меняли состав картофельной смеси, подбирали более удачное сочетание крахмала и приправ, тестировали десятки вариантов вкусов и постепенно адаптировали рецептуру под предпочтения покупателей разных стран. Параллельно появилась знаменитая седловидная форма чипсов, которая позволяла идеально складывать их друг на друга, а цилиндрическая туба практически исключала поломку при транспортировке. В книге этот кейс используется как пример того, что иногда успех рождается не из одной гениальной идеи, а из сотен небольших инженерных улучшений, каждое из которых само по себе кажется незначительным.` },
            { title: "Walmart и P&G: партнерство, которое заново придумало мировую цепочку поставок", tocTitle: "Дистрибьютер тоже клиент", text: `Долгое время отношения между производителями и розничными сетями строились довольно просто. Магазины периодически размещали заказы, производители выпускали товар и отправляли его на склады. Из-за этого постоянно возникали две проблемы: либо полки магазинов пустовали, либо склады были переполнены непроданным товаром. И те, и другие теряли деньги.\n\nПартнерство между P&G и Walmart полностью изменило эту модель. Вместо того чтобы обмениваться только заказами, компании начали обмениваться информацией. P&G получила доступ к данным о продажах практически в режиме реального времени и стала видеть, сколько упаковок каждого товара ежедневно продается в конкретных магазинах. Теперь производство ориентировалось не на прогнозы, а на реальные покупки людей.\n\nЭто позволило построить совершенно новую систему поставок. Если продажи неожиданно росли, заводы быстрее увеличивали выпуск продукции. Если спрос снижался, производство заранее сокращало объемы, не создавая лишних запасов. В результате Walmart получил более заполненные полки и меньше дефицита товаров, а P&G — снижение складских запасов, более стабильное производство и сокращение логистических затрат.\n\nЭта модель позже получила огромное распространение и стала одним из стандартов современной розничной торговли. Но, пожалуй, главный урок этой истории заключался в другом. P&G перестала воспринимать крупнейшего клиента как сторону, с которой нужно постоянно торговаться. Вместо этого компания начала относиться к Walmart как к стратегическому партнеру. Чем успешнее становился Walmart, тем быстрее росла и сама P&G. Вместо игры с нулевой суммой обе компании начали строить систему, в которой выигрывали обе стороны одновременно.` },
            { title: "Crest: как P&G поняла, что доверие важнее рекламы", tocTitle: "Crest", text: `Когда P&G начала разрабатывать зубную пасту Crest с фтором, компания понимала, что обычной рекламой здесь ничего не добиться. Люди не могли самостоятельно оценить, действительно ли паста защищает от кариеса. Они могли почувствовать вкус, запах или свежесть, но не могли увидеть ее главный эффект. Поэтому вместо того чтобы сразу вкладывать огромные бюджеты в продвижение, компания сделала ставку на научные доказательства.\n\nВ течение многих лет P&G финансировала клинические исследования совместно со стоматологами, университетами и медицинскими организациями. Исследования должны были подтвердить, что регулярное использование Crest действительно снижает риск развития кариеса. Только после многочисленных испытаний паста получила официальное признание Американской стоматологической ассоциации (ADA) — на тот момент это было практически недостижимым знаком качества для массового потребительского продукта.\n\nИменно этот момент стал переломным. Вместо обещаний из рекламы компания получила независимое подтверждение эффективности. Для миллионов покупателей логика стала очень простой: если стоматологи официально рекомендуют именно эту пасту, значит, ей можно доверять. Продажи Crest резко выросли, а сама история стала классическим примером того, как научная репутация может стать сильнее любой рекламной кампании. В P&G позже говорили, что они продавали не зубную пасту, а уверенность людей в том, что они действительно защищают здоровье своих детей.` }

дувают поделки из разноцветного стекла в угоду иностранцам.`

                text: `В 1346 году бубонная чума, «черная смерть», переносчиками которой были живущие на крысах блохи, пришла в Европу из Восточной Азии вместе с товарами, которые шли по великой трансазиатской торговой артерии — Шелковому пути. Благодаря активной торговле, зараженные крысы быстро распространили чуму по всему Средиземноморью. К началу 1347 года чума достигла Константинополя. Весной 1348-го она распространилась по Франции, Северной Африке и Италии и убивала примерно половину населения каждой территории, которой она достигала.\n\nАнгличане видели, что зараза приближается, и прекрасно понимали, чем это грозит. В середине августа 1348 года король Эдуард III попросил архиепископа Кентерберийского организовать специальные молебны, и многие епископы отправили приходским священникам письма, которые надлежало зачитать в церквях после проповеди. Эти наставления должны были помочь людям справиться с предстоящими невзгодами. Ральф Шрусберийский, епископ Батский, писал клирикам своей епархии: «Господь Всемогущий со Своего небесного престола насылает гром, молнию и другие кары, чтобы поразить сыновей Своих, грех которых Он желает искупить. И ныне, когда ужасный мор, пришедший с Востока, бесчинствует в соседнем королевстве, мы должны молиться непрестанно, с верою в сердце и со страхом Божиим, чтобы мор сей не протянул и в наш край свои ядовитые щупальца, не поразил и не пожрал нашу паству. Посему надлежит нам всем обратиться к Господу с покаянием, непрестанно исповедуя грехи наши и читая псалмы».\n\nНо это не помогло. Чума пришла и быстро истребила примерно половину населения Англии. Такие катастрофы могут оказывать сильнейшее воздействие на общественные институты. Чума привела к значительным социальным, экономическим и политическим изменениям в средневековой Европе. В начале XIV века в Европе сохранялся феодализм — социально-экономическая и политическая система, которая сформировалась в Западной Европе после падения Римской империи. В ее основе лежала система взаимоотношений между королем, находящимся на самом верху «феодальной лестницы», феодалами в середине и крестьянами в самом низу. Король владел землей и жаловал ее феодалам в обмен на военную службу. Феодалы, в свою очередь, предоставляли землю крестьянам, которые должны были в течение определенного числа дней бесплатно работать на феодала, а также платить различные налоги и подати. Крестьяне, которые из-за своего зависимого положения назывались сервами, были прикреплены к земле и не имели права покинуть ее без разрешения феодала, который был не только землевладельцем, но и судьей, жюри присяжных и полицией в одном лице. Эта система носила ярко выраженный экстрактивный характер: богатство, созданное руками множества крестьян, присваивалось узким слоем землевладельцев.\n\nОгромный дефицит рабочей силы, к которому привела чума, пошатнул основы феодального порядка и побудил крестьян требовать изменения своего положения. Например, в аббатстве Эйншем крестьяне потребовали сокращения многих податей и штрафов, а также отмены повинности в виде бесплатной работы на сеньора. Новый договор с ними начинался так: «В год мора и чумы, что случился в 1349 году, едва ли два арендатора осталось в поместье, и даже они высказали намерение покинуть его, если только брат Николас Аптонский — тогдашний аббат и сеньор их - не согласится изменить условия их работы». Он согласился. Требования крестьян были выполнены.\n\nТо, что случилось в Эйншеме, происходило повсеместно. Крестьяне начали освобождаться от принудительного и бесплатного труда на сеньора, а также от других повинностей. Их заработки стали расти. Попытка властей остановить спровоцированный «черной смертью» процесс изменения социальных институтов и системы распределения доходов провалилась. В 1381 году разразилось крестьянское восстание, и мятежникам во главе с Уотом Тайлером удалось даже захватить большую часть Лондона. Восстание было подавлено, а Тайлер убит, однако дальнейших попыток применить Статус о работниках больше не предпринималось. Феодальные повинности сокращались, в Англии стал формироваться инклюзивный рынок труда, а значит, начали расти и заработки крестьян.\n\nПандемия чумы, по-видимому, прокатилась по всему миру, и повсюду погибла примерно одна и та же доля населения. С демографической точки зрения последствия эпидемии в Восточной Европе были такими же, как в Англии и Западной Европе. Теми же самыми были и социально-экономические последствия чумы: рабочих рук не хватало, и люди стали требовать большей свободы от своих хозяев. Однако на востоке Европы более мощным оказался другой механизм. Да, недостаток рабочих рук мог означать рост заработков в условиях инклюзивного рынка труда. Но дефицит рабочей силы также стимулировал феодалов к тому, чтобы поддерживать экстрактивный характер рынка труда, в основе которого лежал крепостной труд. Переговорная сила крестьян оказалась достаточной, чтобы они добились своего на Западе. Но в Восточной Европе дела обстояли не так.\n\nПосле чумы восточноевропейские землевладельцы начали захватывать все новые земли, так что их поместья — и так более крупные, чем у западных соседей, — стали еще обширнее. В то же время города оставались более слабыми и не такими густонаселенными, как на Западе. Вместо того чтобы приобрести новые права, восточноевропейские крестьяне оказались под угрозой того, что потеряют даже имеющиеся. Социально-экономические последствия «черной смерти» особенно ярко проявились после 1500 года, когда на Западе вырос спрос на продовольственные товары из Восточной Европы: пшеницу, рожь, мясо и другие. 80% ржи поступало в Амстердам с берегов Эльбы, Вислы и Одера. Вскоре уже половина всей быстрорастущей внешней торговли Голландии была ориентирована на Восточную Европу.\n\nЧтобы рост производства успевал за ростом спроса на их товары на Западе, восточноевропейские землевладельцы постепенно, шаг за шагом усиливали контроль над рабочей силой. Впоследствии этот процесс назовут «вторым изданием» крепостничества, чтобы отличить от гораздо более мягкого крепостного права эпохи Высокого Средневековья. Феодалы повысили налоги с крестьянских хозяйств и при этом забирали половину выращенного натурой. В польском Корчине в 1533 году вся работа на феодала оплачивалась. Однако к 1600-му уже в половине случаев феодалы пользовались подневольным крепостным трудом. В 1500 году в Мекленбурге (Восточная Германия) крестьяне должны были выполнять неоплачиваемую работу на сеньора только несколько дней в году. К 1550 году это был уже один день в неделю, а к 1600-му — три дня в неделю. В Венгрии феодалы получили полный контроль над своей землей в 1514 году и установили, что каждый крестьянин обязан один день в неделю бесплатно работать на господина. К середине XVI века обязательными стали два дня бесплатной работы в неделю, а к концу столетия повинность возросла до трех дней. Крепостные, которых касались эти законы, составляли в это время до 90% всего сельского населения.\n\nХотя в 1346 году большой разницы между политическими и экономическими институтами Западной и Восточной Европы не было, к началу XVII столетия это были уже два разных мира. На Западе работники были свободны от феодальных повинностей и пут феодального права, и им скоро предстояло оказаться в самом центре бурно развивающейся рыночной экономики. Крестьяне Восточной Европы тоже становились частью рыночной экономики, но лишь в качестве крепостных, которых силой заставляют работать на хозяина и выращивать сельскохозяйственные продукты, пользующиеся спросом на Западе. Это тоже была рыночная экономика, но она не была инклюзивной.\n\nИнтересно, что такая институциональная дивергенция случилась как раз с теми двумя регионами, которые очень мало различались в начале пути: на западе феодалы были немного более сплоченными, у них было несколько больше прав, а их земельные владения были менее рассредоточены территориально. В то же время города Восточной Европы были меньше по размеру и более бедными, а крестьяне — хуже организованы. В масштабах истории эти различия кажутся небольшими. Однако они оказались очень важными для жителей обоих регионов: когда феодальный порядок был подорван «черной смертью», эти небольшие различия направили Западную и Восточную Европу по разным траекториям институционального развития.\n\n«Черная смерть» — это яркий пример исторической «точки перелома»: важного события или стечения обстоятельств, которое разрушает существующий экономический и политический порядок. Точка перелома подобна обоюдоострому мечу, удар которого может резко повернуть траекторию развития страны как в одну, так и в другую сторону. С одной стороны, в точке перелома замкнутый круг воспроизводства экстрактивных институтов может быть разрушен и им на смену могут прийти более инклюзивные институты, как это произошло в Англии. С другой стороны, экстрактивные институты могут еще более укрепиться, как это произошло в случае со «вторым изданием» крепостничества в Восточной Европе.\n\nПонимание того, как история и точки ее перелома определяют траекторию развития экономических и политических институтов, помогает нам построить более полную и совершенную теорию, объясняющую истоки современных богатства и бедности. Кроме того, это позволяет разобраться в текущем положении вещей в мире и попытаться выяснить, почему одни страны совершают переход к инклюзивным политическим и экономическим институтам, а другие нет.`

                text: `Когда Лиза Аллен впервые пришла к исследователям, её жизнь выглядела совершенно обычной — и далеко не счастливой. Она много лет курила, почти не занималась спортом, часто питалась фастфудом, страдала от лишнего веса и переживала тяжёлый развод. Ей казалось, что всё идёт под откос, и изменить что-либо уже невозможно.\n\nПерелом произошёл неожиданно. После развода Лиза поставила перед собой одну цель — через год отправиться в путешествие и увидеть пирамиды в Египте. Чтобы накопить деньги и чувствовать себя лучше, она решила начать бегать. Первые тренировки были тяжёлыми, но постепенно бег превратился в часть её жизни.\n\nЧерез несколько месяцев начали происходить изменения, которых она вовсе не планировала. Чтобы легче переносить пробежки, Лиза бросила курить. Затем стала внимательнее относиться к еде. Начала раньше ложиться спать. Стала лучше справляться с работой и чаще планировать свои дела. Через несколько лет она была совершенно другим человеком — похудела, получила новую профессию, смогла накопить деньги и действительно отправилась в долгожданное путешествие.\n\nКогда учёные изучили её историю, их удивило не то, что Лиза изменилась, а как это произошло. Она не пыталась одновременно изменить всю свою жизнь. Всё началось с одной привычки, которая постепенно потянула за собой остальные. Такие привычки Дахигг называет ключевыми. Они запускают цепную реакцию: одно небольшое изменение создаёт условия для следующих изменений.\n\nНо автор делает ещё один важный вывод. От привычки почти невозможно избавиться полностью. Если мозг однажды выстроил цикл «сигнал → действие → награда», он продолжает существовать. Поэтому самый эффективный способ изменить поведение — не уничтожать привычку, а заменить само действие, сохранив прежний сигнал и ту же награду. Именно это Дахигг называет «золотым правилом изменения привычек». Люди редко становятся другими за один день, но одна правильно выбранная привычка способна постепенно изменить всю жизнь.`
