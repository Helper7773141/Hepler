            border: none;

        }

            font-weight: 700;

        }
        .header-center .subtitle {
            font-size: 14px;
            color: #6b7a8f;
            margin-top: -2px;
        }

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 999;
        }

            opacity: 1;
            visibility: visible;
        }

            top: 0;
            left: 0;
            width: 80%;
            max-width: 320px;
            height: 100%;
            background: #fff;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.15);
            transform: translateX(-100%);

        }

            transform: translateX(0);
        }

            border: none;
            font-size: 30px;
            color: #0b1a33;
            cursor: pointer;
            margin-bottom: 30px;
            padding: 0;
            line-height: 1;
        }

            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;

        const container = document.getElementById('bookContainer');
        const searchInput = document.getElementById('searchInput');
        let timeoutId = null;

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderBooks(filterText = '') {
            const lowerFilter = filterText.toLowerCase().trim();
            container.innerHTML = '';

            document.querySelectorAll('.book-items').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.book-header').forEach(el => el.classList.remove('open'));

            library.forEach((book) => {
                const titleMatch = book.title.toLowerCase().includes(lowerFilter);
                const itemsMatch = book.items.some(item => item.toLowerCase().includes(lowerFilter));
                const match = titleMatch || itemsMatch;

                const bookDiv = document.createElement('div');
                bookDiv.className = 'book';
                if (!match && lowerFilter !== '') {
                    bookDiv.classList.add('hidden');
                }

                const header = document.createElement('div');
                header.className = 'book-header';
                const titleSpan = document.createElement('span');
                titleSpan.className = 'book-title';
                titleSpan.textContent = book.title;
                const arrowSpan = document.createElement('span');
                arrowSpan.className = 'book-arrow';
                arrowSpan.textContent = '▼';
                header.appendChild(titleSpan);
                header.appendChild(arrowSpan);

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'book-items';

                let clearIdx = 0;
                let fastIdx = 0;
                let isFast = false;

                book.items.forEach((text) => {
                    const row = document.createElement('div');
                    row.className = 'item-row';

                    const numSpan = document.createElement('span');
                    numSpan.className = 'item-num';

                    const isSection = text.includes('section-title');
                    const isSubhead = text.includes('book-subhead');
                    if (isSection || isSubhead) {
                        if (text.includes('Think fast and slow')) {
                            isFast = true;
                            clearIdx = 0;
                            fastIdx = 0;
                        } else {
                            isFast = false;
                            clearIdx = 0;
                            fastIdx = 0;
                        }
                        numSpan.textContent = '';
                    } else {
                        if (isFast) {
                            fastIdx++;
                            numSpan.textContent = fastIdx + '.';
                        } else {
                            clearIdx++;
                            numSpan.textContent = clearIdx + '.';
                        }
                    }

                    const textSpan = document.createElement('span');
                    textSpan.className = 'item-text';
                    if (lowerFilter && (titleMatch || itemsMatch)) {
                        textSpan.innerHTML = highlightText(text, filterText);
                    } else {
                        textSpan.innerHTML = text;
                    }

                    row.appendChild(numSpan);
                    row.appendChild(textSpan);
                    itemsDiv.appendChild(row);
                });

                header.addEventListener('click', () => {
                    const isOpen = itemsDiv.classList.contains('open');

                    document.querySelectorAll('.book-items').forEach(el => {
                        if (el !== itemsDiv) {
                            el.classList.remove('open');
                        }
                    });
                    document.querySelectorAll('.book-header').forEach(el => {
                        if (el !== header) {
                            el.classList.remove('open');
                        }
                    });

                    if (!isOpen) {
                        itemsDiv.classList.add('open');
                        header.classList.add('open');

                        setTimeout(() => {
                            const rect = bookDiv.getBoundingClientRect();
                            const offset = 30;
                            window.scrollTo({
                                top: window.scrollY + rect.top - offset,
                                behavior: 'smooth'
                            });
                        }, 400);
                    } else {
                        itemsDiv.classList.remove('open');
                        header.classList.remove('open');
                    }
                });

                bookDiv.appendChild(header);
                bookDiv.appendChild(itemsDiv);
                container.appendChild(bookDiv);
            });
        }

        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => renderBooks(e.target.value), 150);

                a.href = `#article-${index}`;
                a.textContent = `${index + 1}. ${article.title}`;
                netflixToc.appendChild(a);

                const wrapper = document.createElement('div');
                wrapper.className = 'netflix-article';
                wrapper.id = `article-${index}`;

                num.className = 'num';
                num.textContent = `${index + 1}.`;

                heading.className = 'heading';
                heading.textContent = article.title;

                const text = document.createElement('div');
                text.className = 'text';
                text.textContent = article.text;

                wrapper.appendChild(num);
                wrapper.appendChild(heading);
                wrapper.appendChild(text);

                if (index < netflixArticles.length - 1) {
                    const divider = document.createElement('hr');
                    divider.className = 'netflix-divider';
                    wrapper.appendChild(divider);

                netflixArticlesContainer.appendChild(wrapper);

        function openMenu() {
            menuOverlay.classList.add('open');
            menuPanel.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            menuOverlay.classList.remove('open');
            menuPanel.classList.remove('open');
            document.body.style.overflow = '';
        }

        menuToggle.addEventListener('click', () => {
            if (menuPanel.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        menuOverlay.addEventListener('click', closeMenu);
        menuClose.addEventListener('click', closeMenu);
